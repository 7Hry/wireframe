<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas consultas</title>
    <style>
        body {
            background: #0a0a0a;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }

        .card {
            width: 320px;
            background: #141414;
            border-radius: 16px;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 19px;
            color: #ffffff;
            margin: 0;
        }

        .header span {
            color: #ffffff;
            font-size: 20px;
        }

        button {
            width: 100%;
            height: 52px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-primary {
            height: 56px;
            font-size: 16px;
            background: #12294d;
            color: #5b9bf5;
        }

        .btn-secondary {
            background: #1c1c1c;
            color: #ffffff;
        }

        .btn-link {
            background: #1c1c1c;
            color: #5b9bf5;
        }

        .info-box {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .info-box p {
            margin: 0;
        }

        .info-box .title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .info-box .subtitle {
            font-size: 14px;
            color: #b0b0b0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Minhas consultas</h1>
            <span>&#9678;</span>
        </div>

        <button class="btn-primary">&#128197;Agendar consulta</button>

        <div class="info-box">
            <p class="title">Próxima consulta</p>
            <p class="subtitle">Dr. João Silva — Quinta, 10h</p>
        </div>

        <button class="btn-secondary">&#10005;Cancelar consulta</button>
        <button class="btn-link">&#128222;Falar com a recepção</button>
    </div>

</body>
</html>
